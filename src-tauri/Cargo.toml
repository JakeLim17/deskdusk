[package]
name = "deskdusk"
version = "0.1.1"
edition = "2021"

[lib]
name = "deskdusk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = "0.4"
dirs = "5"
tauri-plugin-notification = "2"
